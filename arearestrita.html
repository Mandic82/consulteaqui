<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área Restrita</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f3b73, #1f5fa8);
      color: #ffffff;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ffffff;
      color: #0f3b73;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
    }

    .erro {
      margin-top: 12px;
      color: #ffd2d2;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div style="display:flex; flex-direction:column; gap:20px; width:100%; align-items:center;">

  <div class="container">
    <h2>DOCUMENTOS PEDAGÓGICOS</h2>

    <button onclick="window.location.href='https://caetanodecampos.my.canva.site/documentos'">Entrar</button>
  </div>
<br>
    <br>
  <div class="container">
    <h2>BIBLIOTECA DIGITAL</h2>
    
<button onclick="window.open('https://drive.google.com/file/d/12BuNgOGwpAbmyHGZJokkabGjOc_6bSFl/view?usp=sharing', '_blank')">Acesso</button>
</div>
<br>
    <br>
  </body>
</html>
