<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Pedagógico</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:25px;

overflow:hidden;

background:
linear-gradient(
135deg,
#0f172a,
#1e3a8a,
#3b82f6
);

background-size:400% 400%;

animation:gradientMove 15s ease infinite;
}

@keyframes gradientMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

body::before{

content:"";

position:absolute;

inset:0;

background:url("https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1600&q=80")
center center/cover;

opacity:.12;

z-index:-2;

}

body::after{

content:"";

position:absolute;

width:800px;
height:800px;

background:
radial-gradient(
circle,
rgba(255,255,255,.25),
transparent 70%
);

top:-250px;
right:-250px;

filter:blur(80px);
z-index:-1;
}

.wrapper{

display:flex;
flex-direction:column;
gap:25px;

width:100%;
max-width:480px;

}

.card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(22px);

border:1px solid rgba(255,255,255,.15);

border-radius:28px;

padding:35px 25px;

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,.35);

transition:.4s ease;

animation:fadeUp .8s ease;
}

.card:hover{

transform:
translateY(-8px)
scale(1.02);

box-shadow:
0 25px 60px rgba(0,0,0,.45);

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.icon{

width:90px;
height:90px;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

font-size:42px;

border-radius:50%;

background:
linear-gradient(
135deg,
rgba(255,255,255,.35),
rgba(255,255,255,.08)
);

margin-bottom:20px;
}

h1{

font-size:30px;
font-weight:700;

margin-bottom:12px;

color:#ffffff;
}

h2{

font-size:24px;

margin-bottom:18px;

color:#fff;
}

.subtitulo{

color:rgba(255,255,255,.85);

line-height:1.6;

margin-bottom:18px;
}

.botao{

display:block;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#60a5fa,
#2563eb
);

color:#fff;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.3s ease;

box-shadow:
0 10px 25px rgba(37,99,235,.45);
}

.botao:hover{

transform:translateY(-3px);

box-shadow:
0 15px 35px rgba(37,99,235,.65);

}

.footer{

text-align:center;

font-size:12px;

color:rgba(255,255,255,.75);

margin-top:5px;
}

@media(max-width:500px){

.card{

padding:30px 20px;

}

h1{

font-size:24px;

}

h2{

font-size:20px;

}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="card">

<div class="icon">
🎓
</div>

<h1>Portal Pedagógico</h1>

<p class="subtitulo">
Acesso rápido aos documentos institucionais e recursos digitais da escola.
</p>

</div>

<div class="card">

<div class="icon">
📚
</div>

<h2>DOCUMENTOS PEDAGÓGICOS</h2>

<button
class="botao"
onclick="window.location.href='https://caetanodecampos.my.canva.site/documentos'">
Acessar
</button>

</div>

<div class="card">

<div class="icon">
💻
</div>

<h2>BIBLIOTECA DIGITAL</h2>

<button
class="botao"
onclick="window.open('https://drive.google.com/file/d/12BuNgOGwpAbmyHGZJokkabGjOc_6bSFl/view?usp=sharing','_blank')">
Acessar
</button>

</div>

<div class="footer">
EECC
</div>

</div>

</body>
</html>
