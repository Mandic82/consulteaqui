
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#2563eb">

<meta name="description"
content="Sistema de consulta de horários da EE Caetano de Campos.">

<title>Consulta de Horários | EE Caetano de Campos</title>

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

/* =====================================
   CONFIGURAÇÕES GERAIS
===================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

html {
  min-height: 100%;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

body {

  min-height: 100vh;
  min-height: 100svh;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  /* CORREÇÃO DA ROLAGEM */

  overflow-x: hidden;
  overflow-y: auto;

  background:
  linear-gradient(
    135deg,
    #172554,
    #2563eb,
    #60a5fa
  );

  background-size: 400% 400%;

  animation: aurora 18s ease infinite;

  transition:
    background .8s ease,
    color .5s ease,
    opacity .3s ease;

  position: relative;
}

/* =====================================
   IMAGEM DE FUNDO
===================================== */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background:
  url("https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1600&q=80");

  background-size: cover;
  background-position: center;

  opacity: .10;

  z-index: -2;

  pointer-events: none;
}

body::after {

  content: "";

  position: fixed;

  width: 900px;
  height: 900px;

  right: -300px;
  top: -250px;

  background:
  radial-gradient(
    circle,
    rgba(255,255,255,.30),
    transparent 70%
  );

  filter: blur(90px);

  z-index: -1;

  pointer-events: none;
}

/* =====================================
   ANIMAÇÃO DO FUNDO
===================================== */

@keyframes aurora {

  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }

}

/* =====================================
   CONTAINER PRINCIPAL
===================================== */

.container {

  width: 100%;
  max-width: 500px;

  background:
  rgba(255,255,255,.12);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  border: 1px solid rgba(255,255,255,.15);

  border-radius: 32px;

  padding: 35px;

  box-shadow:
  0 20px 60px rgba(0,0,0,.30);

  text-align: center;

  transition: background .4s ease;

  animation: fadeUp .8s ease;

  position: relative;

  z-index: 1;

}

/* =====================================
   ANIMAÇÃO DE ENTRADA
===================================== */

@keyframes fadeUp {

  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* =====================================
   ÍCONE DA ESCOLA
===================================== */

.hero-icon {

  width: 120px;
  height: 120px;

  margin: 0 auto 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
  linear-gradient(
    135deg,
    rgba(255,255,255,.35),
    rgba(255,255,255,.08)
  );

  backdrop-filter: blur(15px);

  box-shadow:
  0 15px 30px rgba(0,0,0,.25);

}

.hero-icon img {

  width: 75px;
  height: 75px;

  object-fit: contain;

}

/* =====================================
   IDENTIFICAÇÃO DA ESCOLA
===================================== */

.school-badge {

  display: inline-block;

  padding: 8px 18px;

  border-radius: 999px;

  background:
  rgba(255,255,255,.18);

  backdrop-filter: blur(12px);

  font-size: 12px;

  font-weight: 600;

  letter-spacing: 1px;

  text-transform: uppercase;

  margin-bottom: 18px;

}

/* =====================================
   TÍTULOS
===================================== */

h1 {

  font-size: 32px;

  font-weight: 700;

  margin-bottom: 10px;

}

.subtitle {

  font-size: 15px;

  line-height: 1.6;

  opacity: .92;

  margin-bottom: 25px;

}

/* =====================================
   BOTÕES
===================================== */

button {

  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 18px;

  font-size: 16px;

  font-weight: 600;

  color: #fff;

  cursor: pointer;

  background:
  linear-gradient(
    135deg,
    #60a5fa,
    #2563eb
  );

  box-shadow:
  0 10px 25px rgba(37,99,235,.45);

  transition:
  transform .3s ease,
  box-shadow .3s ease;

  -webkit-tap-highlight-color: transparent;

}

button:hover {

  transform: translateY(-3px);

  box-shadow:
  0 20px 40px rgba(37,99,235,.55);

}

button:active {

  transform: scale(.98);

}

button:focus-visible {

  outline: 3px solid #fff;

  outline-offset: 4px;

}

/* =====================================
   BOTÃO MODO ESCURO
===================================== */

.theme-btn {

  margin-bottom: 20px;

  background:
  rgba(255,255,255,.20);

  color: #fff;

  border: 1px solid rgba(255,255,255,.25);

  box-shadow: none;

}

/* =====================================
   FORMULÁRIO
===================================== */

.form-group {

  text-align: left;

  margin-bottom: 20px;

}

label {

  display: block;

  margin-bottom: 8px;

  font-weight: 500;

}

select {

  display: block;

  width: 100%;

  min-height: 58px;

  padding: 15px;

  border-radius: 16px;

  border: 2px solid transparent;

  outline: none;

  background:
  rgba(255,255,255,.92);

  color: #111827;

  font-size: 15px;

  transition: .3s ease;

  cursor: pointer;

  -webkit-appearance: auto;

  appearance: auto;

}

select:focus {

  border-color: #60a5fa;

  box-shadow:
  0 0 0 4px rgba(96,165,250,.25);

}

/* =====================================
   BOTÃO CONSULTAR
===================================== */

.consultar-btn {

  display: block;

  width: 100%;

  margin-top: 5px;

  margin-bottom: 5px;

  position: relative;

  z-index: 2;

}

/* =====================================
   RODAPÉ
===================================== */

footer {

  margin-top: 25px;

  font-size: 12px;

  color:
  rgba(255,255,255,.80);

  line-height: 1.8;

}

/* =====================================
   MODO ESCURO
===================================== */

body.dark {

  background:
  linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #1e293b
  );

  background-size: 400% 400%;

}

body.dark .container {

  background:
  rgba(15,23,42,.86);

  border-color: rgba(255,255,255,.10);

}

body.dark select {

  background: #334155;

  color: #fff;

  border-color: #475569;

}

body.dark label,
body.dark h1,
body.dark .subtitle,
body.dark .school-badge {

  color: #fff;

}

/* =====================================
   TELA DE CARREGAMENTO
===================================== */

.loading {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background:
  linear-gradient(
    135deg,
    #172554,
    #2563eb
  );

  z-index: 9999;

  color: #fff;

}

.loading.active {

  display: flex;

}

.spinner {

  width: 65px;
  height: 65px;

  border: 6px solid rgba(255,255,255,.25);

  border-top: 6px solid #fff;

  border-radius: 50%;

  margin-bottom: 18px;

  animation: spin 1s linear infinite;

}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

/* =====================================
   RESPONSIVIDADE
===================================== */

@media (max-width: 500px) {

  body {

    align-items: flex-start;

    justify-content: center;

    overflow-x: hidden;

    overflow-y: auto;

    padding: 12px;

  }

  .container {

    width: 100%;

    max-width: 500px;

    margin: 12px auto 25px;

    padding: 25px 22px;

    animation:
    fadeUp .8s ease,
    floating 6s ease-in-out infinite;

  }

  h1 {

    font-size: 28px;

  }

  .hero-icon {

    width: auto;
    height: auto;

    background: none;

    border: none;

    box-shadow: none;

    margin: 0 auto 20px;

  }

  .hero-icon img {

    width: 170px;

    height: auto;

    filter:
    drop-shadow(
      0 10px 20px rgba(0,0,0,.35)
    );

  }

  select {

    min-height: 58px;

    font-size: 16px;

  }

  button {

    min-height: 58px;

  }

  @keyframes floating {

    0% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-5px);
    }

    100% {
      transform: translateY(0);
    }

  }

}

/* =====================================
   TELAS MUITO PEQUENAS
===================================== */

@media (max-width: 360px) {

  .container {

    padding: 22px 16px;

  }

  h1 {

    font-size: 25px;

  }

  .hero-icon img {

    width: 145px;

  }

}

/* =====================================
   ACESSIBILIDADE
===================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    scroll-behavior: auto !important;

    transition-duration: .01ms !important;

  }

}

</style>

</head>

<body>

<!-- =====================================
     CONTEÚDO PRINCIPAL
===================================== -->

<main class="container">

  <div class="hero-icon">

    <img
    src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Round_Landmark_School_Icon_-_Transparent.svg/960px-Round_Landmark_School_Icon_-_Transparent.svg.png"
    alt="Identidade visual da escola">

  </div>

  <div class="school-badge">
    EE Caetano de Campos
  </div>

  <h1>Consulta de Horários</h1>

  <p class="subtitle">
    Consulte horários
  </p>

  <!-- MODO ESCURO -->

  <button
  type="button"
  id="toggleTheme"
  class="theme-btn">

    🌙 Modo Escuro

  </button>

  <!-- SELEÇÃO DO PERÍODO -->

  <div class="form-group">

    <label for="periodo">
      Período
    </label>

    <select id="periodo">

      <option value="manha">
        Manhã
      </option>

      <option value="tarde">
        Tarde
      </option>

    </select>

  </div>

  <!-- SELEÇÃO DA CONSULTA -->

  <div class="form-group">

    <label for="consulta">
      Consulta
    </label>

    <select id="consulta">

      <option value="salas">
        Salas / Turmas
      </option>

      <option value="professores">
        Professores
      </option>

      <option value="reserva">
        Reserva de Salas
      </option>

      <option value="responsável">
        Projetos
      </option>

      <option value="tabeladoM">
        TAB – Manhã
      </option>

      <option value="tabeladoT">
        TAB – Tarde
      </option>

    </select>

  </div>

  <!-- BOTÃO CONSULTAR -->

  <button
  type="button"
  class="consultar-btn"
  id="consultarBtn"
  onclick="consultarHorario()">

    Consultar Horário

  </button>

  <footer>

    EE Caetano de Campos<br>
    • 2026

  </footer>

</main>

<!-- =====================================
     TELA DE CARREGAMENTO
===================================== -->

<div class="loading" id="loading">

  <div class="spinner"></div>

  <p>
    Abrindo horário...
  </p>

</div>

<script>

/* =====================================
   CONSULTA DE HORÁRIOS
===================================== */

function consultarHorario() {

  const periodo =
  document.getElementById('periodo').value;

  const consulta =
  document.getElementById('consulta').value;

  let link = '';

  /* SALAS E TURMAS */

  if (periodo === 'manha' && consulta === 'salas') {

    link =
    'https://drive.google.com/file/d/1D48q3kgDMGc8YMxzeRqsv6nCChZWT1_b/view';

  }

  else if (periodo === 'tarde' && consulta === 'salas') {

    link =
    'https://drive.google.com/file/d/1XRSBMViNVFxVqafAFm6lmKQPw4kdVFyh/view';

  }

  /* PROFESSORES */

  else if (periodo === 'manha' && consulta === 'professores') {

    link =
    'https://drive.google.com/file/d/1d8mOtIMI8avP71uPFwkuFEfKwIgFK85r/view';

  }

  else if (periodo === 'tarde' && consulta === 'professores') {

    link =
    'https://drive.google.com/file/d/1cRgInPQtgzgCBFoK14evorMnPB39TZgW/view';

  }

  /* RESERVA E PROJETOS */

  else if (
    consulta === 'reserva' ||
    consulta === 'responsável'
  ) {

    link =
    'https://drive.google.com/file/d/18pzuHCD-bfLUu4Lxhny6rppRyzwDz_vh/view?usp=drivesdk';

  }

  /* TABELADO */

  else if (consulta === 'tabeladoM') {

    link =
    'https://drive.google.com/file/d/12E2IMJpzFLZwhBSqH2tPDfUxo2rGHlOP/view';

  }

  else if (consulta === 'tabeladoT') {

    link =
    'https://drive.google.com/file/d/1ii4NNx2EuIRpbXCfeJQi3bwXSqjnnB7A/view';

  }

  /* VERIFICAÇÃO */

  if (link) {

    const loading =
    document.getElementById('loading');

    loading.classList.add('active');

    setTimeout(() => {

      window.location.href = link;

    }, 700);

  }

  else {

    alert('Selecione as opções corretamente.');

  }

}

/* =====================================
   MODO ESCURO
===================================== */

const toggleTheme =
document.getElementById('toggleTheme');

/* RECUPERA O TEMA SALVO */

try {

  if (localStorage.getItem('theme') === 'dark') {

    document.body.classList.add('dark');

    toggleTheme.innerHTML =
    '☀️ Modo Claro';

  }

} catch (erro) {

  console.warn('Não foi possível recuperar o tema.');

}

/* ALTERNA O TEMA */

toggleTheme.addEventListener('click', () => {

  document.body.classList.toggle('dark');

  const modoEscuro =
  document.body.classList.contains('dark');

  if (modoEscuro) {

    toggleTheme.innerHTML =
    '☀️ Modo Claro';

  } else {

    toggleTheme.innerHTML =
    '🌙 Modo Escuro';

  }

  try {

    localStorage.setItem(
      'theme',
      modoEscuro ? 'dark' : 'light'
    );

  } catch (erro) {

    console.warn('Não foi possível salvar o tema.');

  }

});

/* =====================================
   SERVICE WORKER
===================================== */

if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker
    .register('./sw.js')

    .then(() => {

      console.log(
        'Service Worker registrado com sucesso.'
      );

    })

    .catch((erro) => {

      console.error(
        'Erro ao registrar Service Worker:',
        erro
      );

    });

  });

}

</script>

</body>

</html>
