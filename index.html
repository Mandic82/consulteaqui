<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Horários</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  overflow:hidden;

  background:
  linear-gradient(
  135deg,
  #172554,
  #2563eb,
  #60a5fa
  );

  background-size:400% 400%;

  animation:aurora 18s ease infinite;

  transition:
  background .8s ease,
  color .5s ease,
  opacity .3s ease;
}

/* FOTO DE FUNDO */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
  url("https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1600&q=80");

  background-size:cover;
  background-position:center;

  opacity:.10;

  z-index:-2;

}

body::after{

  content:"";

  position:fixed;

  width:900px;
  height:900px;

  right:-300px;
  top:-250px;

  background:
  radial-gradient(
  circle,
  rgba(255,255,255,.30),
  transparent 70%
  );

  filter:blur(90px);

  z-index:-1;

}

@keyframes aurora{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

.container{

  width:100%;
  max-width:500px;

  background:
  rgba(255,255,255,.12);

  backdrop-filter:blur(25px);

  border:1px solid rgba(255,255,255,.15);

  border-radius:32px;

  padding:35px;

  box-shadow:
  0 20px 60px rgba(0,0,0,.30);

  text-align:center;

  transition:
  .4s ease;

  animation:fadeUp .8s ease;

}

.container:hover{

  transform:
  translateY(-5px);

}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* HERO */

.hero-icon{

  width:120px;
  height:120px;

  margin:0 auto 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.35),
  rgba(255,255,255,.08)
  );

  backdrop-filter:blur(15px);

  box-shadow:
  0 15px 30px rgba(0,0,0,.25);

}

.hero-icon img{

  width:75px;
  height:75px;

}

.school-badge{

  display:inline-block;

  padding:8px 18px;

  border-radius:999px;

  background:
  rgba(255,255,255,.18);

  backdrop-filter:blur(12px);

  font-size:12px;
  font-weight:600;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:18px;

}

h1{

  font-size:32px;
  font-weight:700;

  margin-bottom:10px;
}

.subtitle{

  font-size:15px;

  line-height:1.6;

  opacity:.92;

  margin-bottom:25px;

}

.theme-btn{

  margin-bottom:20px;

  background:
  rgba(255,255,255,.20);

  color:#fff;

  border:1px solid rgba(255,255,255,.25);
}

.form-group{

  text-align:left;

  margin-bottom:20px;
}

label{

  display:block;

  margin-bottom:8px;

  font-weight:500;
}

select{

  width:100%;

  padding:15px;

  border-radius:16px;

  border:2px solid transparent;

  outline:none;

  background:
  rgba(255,255,255,.92);

  font-size:15px;

  transition:.3s ease;
}

select:focus{

  border-color:#60a5fa;

  box-shadow:
  0 0 0 4px rgba(96,165,250,.25);

}

button{

  width:100%;

  padding:16px;

  border:none;

  border-radius:18px;

  font-size:16px;
  font-weight:600;

  color:#fff;

  cursor:pointer;

  background:
  linear-gradient(
  135deg,
  #60a5fa,
  #2563eb
  );

  box-shadow:
  0 10px 25px rgba(37,99,235,.45);

  transition:.35s ease;
}

button:hover{

  transform:
  translateY(-4px)
  scale(1.02);

  box-shadow:
  0 20px 40px rgba(37,99,235,.65);
}

button:active{

  transform:scale(.98);
}

footer{

  margin-top:25px;

  font-size:12px;

  color:
  rgba(255,255,255,.80);

}

/* MODO ESCURO */

body.dark{

  background:
  linear-gradient(
  135deg,
  #020617,
  #0f172a,
  #1e293b
  );
}

body.dark .container{

  background:
  rgba(15,23,42,.86);
}

body.dark select{

  background:#334155;
  color:#fff;
}

/* LOADING */

.loading{

  position:fixed;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:
  linear-gradient(
  135deg,
  #172554,
  #2563eb
  );

  z-index:9999;
}

.spinner{

  width:65px;
  height:65px;

  border:6px solid rgba(255,255,255,.25);
  border-top:6px solid #fff;

  border-radius:50%;

  margin-bottom:18px;

  animation:spin 1s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

@media(max-width:500px){

.container{

  animation:
    fadeUp .8s ease,
    floating 6s ease-in-out infinite;

}

@keyframes floating{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }

}
.hero-icon{

  width:auto;
  height:auto;

  background:none;
  border:none;
  box-shadow:none;

  margin:0 auto 20px;
}

.hero-icon img{

  width:170px;

  height:auto;

  filter:
    drop-shadow(
      0 10px 20px rgba(0,0,0,.35)
    );

}
@keyframes floatIcon{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0);
  }

}

</style>

</head>

<body>

<div class="container">

<div class="hero-icon">

<img
src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Round_Landmark_School_Icon_-_Transparent.svg/960px-Round_Landmark_School_Icon_-_Transparent.svg.png"
alt="Escola">

</div>

<div class="school-badge">
EE Caetano de Campos
</div>

<h1>Consulta de Horários</h1>

<p class="subtitle">
Consulte horários
</p>

<button
id="toggleTheme"
class="theme-btn">
🌙 Modo Escuro
</button>

<div class="form-group">

<label for="periodo">
Período
</label>

<select id="periodo">

<option value="manha">
Manhã
</option>

<option value="tarde">
Tarde
</option>

</select>

</div>

<div class="form-group">

<label for="consulta">
Consulta
</label>

<select id="consulta">

<option value="salas">
Salas / Turmas
</option>

<option value="professores">
Professores
</option>

<option value="reserva">
Reserva de Salas
</option>

<option value="responsável">
Projetos
</option>

<option value="tabeladoM">
TAB – Manhã
</option>

<option value="tabeladoT">
TAB – Tarde
</option>

</select>

</div>

<button onclick="consultarHorario()">
Consultar Horário
</button>

<footer>
EE Caetano de Campos<br>
• 2026
</footer>

</div>

<div class="loading" id="loading">

<div class="spinner"></div>

<p>
Abrindo horário...
</p>

</div>

<script>
/* =====================================
   CONSULTA DE HORÁRIOS
===================================== */

function consultarHorario() {

  const periodo = document.getElementById('periodo').value;
  const consulta = document.getElementById('consulta').value;

  let link = '';

  if (periodo === 'manha' && consulta === 'salas') {

    link =
    'https://drive.google.com/file/d/1D48q3kgDMGc8YMxzeRqsv6nCChZWT1_b/view';

  }

  else if (periodo === 'tarde' && consulta === 'salas') {

    link =
    'https://drive.google.com/file/d/1XRSBMViNVFxVqafAFm6lmKQPw4kdVFyh/view';

  }

  else if (periodo === 'manha' && consulta === 'professores') {

    link =
    'https://drive.google.com/file/d/1d8mOtIMI8avP71uPFwkuFEfKwIgFK85r/view';

  }

  else if (periodo === 'tarde' && consulta === 'professores') {

    link =
    'https://drive.google.com/file/d/1cRgInPQtgzgCBFoK14evorMnPB39TZgW/view';

  }

  else if (
    consulta === 'reserva' ||
    consulta === 'responsável'
  ) {

    link =
    'https://drive.google.com/file/d/18pzuHCD-bfLUu4Lxhny6rppRyzwDz_vh/view?usp=drivesdk';

  }

  else if (consulta === 'tabeladoM') {

    link =
    'https://drive.google.com/file/d/12E2IMJpzFLZwhBSqH2tPDfUxo2rGHlOP/view';

  }

  else if (consulta === 'tabeladoT') {

    link =
    'https://drive.google.com/file/d/1ii4NNx2EuIRpbXCfeJQi3bwXSqjnnB7A/view';

  }

  if (link) {

    document.getElementById('loading').style.display = 'flex';

    setTimeout(() => {

      window.location.href = link;

    }, 900);

  } else {

    alert('Selecione as opções corretamente.');

  }

}

/* =====================================
   MODO ESCURO PREMIUM
===================================== */

const toggleTheme =
document.getElementById('toggleTheme');

/* CARREGA O TEMA SALVO */

if (
  localStorage.getItem('theme') === 'dark'
) {

  document.body.classList.add('dark');

  toggleTheme.innerHTML =
  '☀️ Modo Claro';

}

/* ALTERNA O TEMA */

toggleTheme.addEventListener('click', () => {

  document.body.style.opacity = '.97';

  setTimeout(() => {

    document.body.classList.toggle('dark');

    if (
      document.body.classList.contains('dark')
    ) {

      localStorage.setItem(
        'theme',
        'dark'
      );

      toggleTheme.innerHTML =
      '☀️ Modo Claro';

    } else {

      localStorage.setItem(
        'theme',
        'light'
      );

      toggleTheme.innerHTML =
      '🌙 Modo Escuro';

    }

    setTimeout(() => {

      document.body.style.opacity = '1';

    }, 80);

  }, 120);

});

/* =====================================
   ANIMAÇÃO DE ENTRADA
===================================== */

window.addEventListener('load', () => {

  const container =
  document.querySelector('.container');

  container.animate(
    [
      {
        opacity: 0,
        transform:
        'translateY(40px)'
      },
      {
        opacity: 1,
        transform:
        'translateY(0)'
      }
    ],
    {
      duration: 700,
      easing: 'ease-out'
    }
  );

});

/* =====================================
   EFEITO PARALLAX LEVE NO CARD
===================================== */

const card =
document.querySelector('.container');

document.addEventListener(
'mousemove',
(e) => {

  const x =
  (window.innerWidth / 2 - e.clientX)
  / 45;

  const y =
  (window.innerHeight / 2 - e.clientY)
  / 45;

  card.style.transform =
  `rotateY(${x}deg) rotateX(${-y}deg)`;

});

document.addEventListener(
'mouseleave',
() => {

  card.style.transform =
  'rotateY(0deg) rotateX(0deg)';

});

/* =====================================
   SERVICE WORKER
===================================== */

if ('serviceWorker' in navigator) {

  navigator.serviceWorker
    .register('sw.js')

    .then(() => {

      console.log(
      '✅ Service Worker registrado'
      );

    })

    .catch((erro) => {

      console.log(
      'Erro ao registrar SW:',
      erro
      );

    });

}

</script>

</body>
</html>
