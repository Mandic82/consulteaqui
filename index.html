<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta de Horários</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2575fc">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100svh;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  color: #fff;
  transition: 0.3s ease;
}

.container {
  width: 100%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: 0 16px 35px rgba(0,0,0,0.25);
  text-align: center;
  transition: 0.3s ease;
}

.icon {
  font-size: 3.2rem;
  margin-bottom: 8px;
}

h1 {
  font-size: 1.9rem;
  margin-bottom: 6px;
}

p {
  font-size: 0.95rem;
  opacity: 0.95;
  margin-bottom: 22px;
}

.form-group {
  margin-bottom: 18px;
  text-align: left;
}

label {
  font-size: 0.95rem;
  margin-bottom: 6px;
  display: block;
}

select {
  width: 100%;
  padding: 14px;
  font-size: 1rem;
  border-radius: 14px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.95);
  color: #333;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 1.1rem;
  font-weight: 600;
  border: none;
  border-radius: 16px;
  background: #ffffff;
  color: #2575fc;
  cursor: pointer;
  transition: 0.3s;
}

footer {
  margin-top: 18px;
  font-size: 0.78rem;
  opacity: 0.85;
}

/* BOTÃO DE TEMA */
.theme-btn {
  margin-bottom: 18px;
  background: rgba(255,255,255,0.20);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(10px);
}

.theme-btn:hover {
  background: rgba(255,255,255,0.30);
}

/* TEMA ESCURO */
body.dark {
  background: linear-gradient(135deg, #0f172a, #1e293b);
}

body.dark .container {
  background: rgba(15, 23, 42, 0.85);
}

body.dark select {
  background: #334155;
  color: #fff;
}

body.dark button:not(.theme-btn) {
  background: #4f46e5;
  color: #fff;
}

body.dark footer {
  color: rgba(255,255,255,0.8);
}

/* LOADING */
.loading {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9999;
}

body.dark .loading {
  background: linear-gradient(135deg, #0f172a, #1e293b);
}

.spinner {
  width: 55px;
  height: 55px;
  border: 5px solid rgba(255,255,255,0.3);
  border-top: 5px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* CELULARES */
@media (max-width: 480px) {

  body {
    padding: 10px;
  }

  .container {
    max-width: 100%;
    padding: 22px 18px;
    border-radius: 18px;
  }

  .icon {
    font-size: 2.6rem;
  }

  h1 {
    font-size: 1.55rem;
  }

  p {
    font-size: 0.9rem;
  }

  select,
  button {
    font-size: 0.95rem;
    padding: 14px;
  }

  footer {
    font-size: 0.72rem;
  }
}

/* CELULARES PEQUENOS */
@media (max-width: 320px) {

  .icon {
    font-size: 2.2rem;
  }

  h1 {
    font-size: 1.3rem;
  }

  select,
  button {
    padding: 12px;
    font-size: 0.9rem;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="icon">📅</div>

  <h1>Consulta de Horários</h1>

  <p>Escolha o período e o tipo de consulta</p>

  <button id="toggleTheme" class="theme-btn">
    🌙 Modo Escuro
  </button>

  <div class="form-group">
    <label for="periodo">Período</label>
    <select id="periodo">
      <option value="manha">Manhã</option>
      <option value="tarde">Tarde</option>
    </select>
  </div>

  <div class="form-group">
    <label for="consulta">Consulta</label>
    <select id="consulta">
      <option value="salas">Salas / Turmas</option>
      <option value="professores">Professores</option>
      <option value="reserva">Reserva de Salas</option>
      <option value="responsável">Projetos</option>
      <option value="tabeladoM">TAB – Manhã</option>
      <option value="tabeladoT">TAB – Tarde</option>
    </select>
  </div>

  <button onclick="consultarHorario()">Consultar</button>

  <footer>
    © 2026 • <br>
    EECC
  </footer>

</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Abrindo horário...</p>
</div>

<script>
function consultarHorario() {

  const periodo = document.getElementById('periodo').value;
  const consulta = document.getElementById('consulta').value;

  let link = '';

  if (periodo === 'manha' && consulta === 'salas') {
    link = 'https://drive.google.com/file/d/1D48q3kgDMGc8YMxzeRqsv6nCChZWT1_b/view';
  } else if (periodo === 'tarde' && consulta === 'salas') {
    link = 'https://drive.google.com/file/d/1XRSBMViNVFxVqafAFm6lmKQPw4kdVFyh/view';
  } else if (periodo === 'manha' && consulta === 'professores') {
    link = 'https://drive.google.com/file/d/1d8mOtIMI8avP71uPFwkuFEfKwIgFK85r/view';
  } else if (periodo === 'tarde' && consulta === 'professores') {
    link = 'https://drive.google.com/file/d/1cRgInPQtgzgCBFoK14evorMnPB39TZgW/view';
  } else if (consulta === 'reserva' || consulta === 'responsável') {
    link = 'https://drive.google.com/file/d/18pzuHCD-bfLUu4Lxhny6rppRyzwDz_vh/view?usp=drivesdk';
  } else if (consulta === 'tabeladoM') {
    link = 'https://drive.google.com/file/d/12E2IMJpzFLZwhBSqH2tPDfUxo2rGHlOP/view';
  } else if (consulta === 'tabeladoT') {
    link = 'https://drive.google.com/file/d/1ii4NNx2EuIRpbXCfeJQi3bwXSqjnnB7A/view';
  }

  if (link) {
    document.getElementById('loading').style.display = 'flex';

    setTimeout(() => {
      window.location.href = link;
    }, 900);

  } else {
    alert('Selecione as opções corretamente.');
  }
}

/* MODO ESCURO */

const toggleTheme = document.getElementById('toggleTheme');

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  toggleTheme.innerHTML = '☀️ Modo Claro';
}

toggleTheme.addEventListener('click', () => {

  document.body.classList.toggle('dark');

  if (document.body.classList.contains('dark')) {
    localStorage.setItem('theme', 'dark');
    toggleTheme.innerHTML = '☀️ Modo Claro';
  } else {
    localStorage.setItem('theme', 'light');
    toggleTheme.innerHTML = '🌙 Modo Escuro';
  }

});

/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
